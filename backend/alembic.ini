[alembic]
# Path ke folder versions (relatif dari root project backend/)
script_location = alembic

# Template untuk nama file migrasi
file_template = %%(rev)s_%%(slug)s

# Timezone yang digunakan di pesan migrasi
timezone = Asia/Jakarta

# Koneksi SQL Server — akan di-override oleh env.py yang membaca DATABASE_URL dari env variable
# Baris ini tidak perlu diubah di sini; cukup set DATABASE_URL di .env
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
